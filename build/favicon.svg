<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#grad1)"/>
  <!-- Graduation cap -->
  <g transform="translate(50, 35)">
    <!-- Cap top -->
    <path d="M -25 0 L 0 -15 L 25 0 Z" fill="white"/>
    <!-- Cap board -->
    <rect x="-28" y="0" width="56" height="4" fill="white"/>
    <!-- Tassel -->
    <line x1="0" y1="4" x2="0" y2="20" stroke="white" stroke-width="2"/>
    <circle cx="0" cy="22" r="3" fill="white"/>
  </g>
  <!-- Book symbol -->
  <g transform="translate(50, 60)">
    <rect x="-15" y="-8" width="30" height="16" fill="none" stroke="white" stroke-width="2" rx="2"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="white" stroke-width="1.5"/>
  </g>
</svg>